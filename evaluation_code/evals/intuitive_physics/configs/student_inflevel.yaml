# Eval config for a frozen student encoder + frozen teacher (target encoder) + predictor.
# Checkpoint must contain keys: encoder, target_encoder, predictor, epoch
# (build it with tools/pack_student_checkpoint.py).
pretrain:
  enc_checkpoint_key: encoder
  pred_checkpoint_key: predictor
  # Architecture of encoder AND target_encoder (must be identical): one of
  # vit_base, vit_base_rope, vit_large, vit_large_rope, vit_huge, vit_huge_rope
  # (see src/models/vision_transformer.py). Add a factory there if yours differs.
  model_name: vit_large_rope
  patch_size: 16
  tubelet_size: 2
  frames_per_clip: 16
  folder: /path/to/checkpoints/student/      # directory holding the checkpoint
  checkpoint: student-latest.pth.tar         # file name inside folder
  write_tag: student                         # prefix of the output csv/pth files
  # Encoder/predictor build flags: must match how your networks were built.
  use_sdpa: true
  use_silu: false
  wide_silu: true
  uniform_power: true
  is_causal: false
  pred_is_causal: false
  pred_depth: 12                             # predictor depth (predictor width is fixed at 384 in eval.py)
data:
  batch_size: 1
  resolution: 224
  stride_sliding_window: 2
  use_bfloat16: true
  frames_per_clip: 16
  context_lengths: [2,4,6,8,10]
  frame_steps: 2
  normalize_context: false                   # layer-norm student context tokens before the predictor
# Layer-norm teacher tokens before the L1 loss (V-JEPA does this).
# Set to false if your predictor was trained against raw teacher features.
normalize_targets: true
wandb:
  enabled: true
  project: intphys-eval
  entity: null                     # your W&B team/user, or null for default
  name: null                       # defaults to <write_tag>-<dataset>-<tag>
  group: salt_student
  tags: [vit_small, frozen_teacher, ssv2]
  mode: online                     # or "offline" on nodes without internet (then: wandb sync)
tag: student
nodes: 1
tasks_per_node: 6
eval_name: intuitive_physics
dataset: inflevel_lab
