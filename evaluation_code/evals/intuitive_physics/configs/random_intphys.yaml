# IntPhys CHANCE-LEVEL CONTROL: same ViT-S architecture as student_intphys.yaml,
# but encoder, target_encoder and predictor are all randomly initialised.
# This is the paper's vit-*-random-N baseline. Any real score must be read
# against whatever this run produces -- it defines what "chance" means for
# this architecture, this masking and this data.
#
# Checkpoint is produced by:
#   python tools/make_random_checkpoint.py --config <this file> \
#       --out ../checkpoints/random_vit_s/student-latest.pth.tar --seed 0
pretrain:
  enc_checkpoint_key: encoder
  pred_checkpoint_key: predictor
  folder: /scratch/sd6701/jepa-intuitive-physics/checkpoints/random_vit_s/
  checkpoint: student-latest.pth.tar
  write_tag: random_vit_s

  # --- architecture: must stay identical to student_intphys.yaml, or the
  #     control is not a control ---
  model_name: vit_small_rope
  patch_size: 16
  tubelet_size: 1                  # student + teacher 8f00b836 both trained at tubelet 1 (16 temporal tokens, 3136 tok/clip)
  frames_per_clip: 16
  use_sdpa: true
  use_silu: false                  # p-salt: use_silu false, use_pred_silu false
  wide_silu: false                 # p-salt: wide_silu false (inert while use_silu is false)
  uniform_power: false             # p-salt: uniform_power false
  is_causal: false                 # bi-directional
  pred_is_causal: false            # bi-directional
  pred_depth: 12                   # verified against checkpoint config.model
  pred_embed_dim: 384              # verified: predictor_embed (384, 384)
  pred_num_heads: 16               # verified: config.model.pred_num_heads (encoder itself has 6)

  # --- plug in the p-salt predictor class instead of the repo's vit_predictor ---
  # Uncomment once adapters/salt_student.py::build_salt_predictor is filled in.
  # custom_model_module: evals.intuitive_physics.adapters.salt_student
  # custom_model_kwargs:
  #   model_name: vit_small
  #   tubelet_size: 1
  #   use_salt_predictor: true
  #   salt_predictor_kwargs: {}
data:
  batch_size: 1
  resolution: 224
  stride_sliding_window: 2
  use_bfloat16: true
  frames_per_clip: 16
  context_lengths: [2,4,6,8,10]
  frame_steps: 2
  normalize_context: false
normalize_targets: true            # set false if the predictor was trained on raw (un-layernormed) teacher tokens
wandb:
  enabled: true
  project: rethinking-jepa
  entity: null                     # your W&B team/user, or null for default
  name: null                       # defaults to <write_tag>-<dataset>-<tag>
  group: random_control
  tags: [vit_small, random_init, control]
  mode: online                     # or "offline" on nodes without internet (then: wandb sync)
tag: random_vit_s
nodes: 1
tasks_per_node: 1
eval_name: intuitive_physics
dataset: intphys
